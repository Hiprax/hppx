name: Release

# Publishes to npm through trusted publishing (OIDC): no npm token exists in
# this repository. The npm side (npmjs.com -> hppx -> Settings -> Trusted
# Publisher) trusts Hiprax/hppx, workflow file `release.yml`, no environment,
# with direct `npm publish` allowed.
#
# The work is split so that the only job able to mint an npm credential
# (`id-token: write`) never installs or runs dependency code:
#   build          every quality gate, then `npm pack`; uploads the tarball
#   publish        publishes exactly that tarball, with provenance
#   github-release waits until the registry serves that same tarball, then
#                  creates the GitHub Release from CHANGELOG.md
#
# The run must be for the release tag itself: npm's provenance records the
# triggering ref and commit, so a manual run is started on the tag ("Run
# workflow" -> "Use workflow from" -> Tags -> vX.Y.Z), never on a branch.
#
# Recovery: fix the cause, then use "Re-run failed jobs" on the same run (the
# tarball artifact is kept for 30 days). Running the workflow again on the tag
# only helps when nothing was published: npm refuses to publish a version twice,
# so a new run would stop at `publish` and never reach `github-release`.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {} # every job below requests only what it uses

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Ref names reach scripts only through the environment, never through
  # `${{ }}` interpolation inside `run:`.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    outputs:
      name: ${{ steps.pack.outputs.name }}
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}

    steps:
      - name: Validate the release tag
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::Run this workflow on a release tag, not on $GITHUB_REF: provenance records the triggering ref and commit."
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not of the form vX.Y.Z (prereleases are not published by this workflow)."
            exit 1
          fi

      - name: Checkout the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag points at a commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$RELEASE_TAG ($(git rev-parse --short HEAD)) is not on main. Only reviewed, merged code is published."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          # No dependency cache in a release build: a poisoned cache entry
          # must not be able to reach a published package.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run every quality gate
        run: npm run verify

      - name: Verify package.json version matches the tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PKG_VERSION. Refusing to publish."
            exit 1
          fi

      - name: Pack the tarball
        id: pack
        run: |
          # `npm run verify` has just built and checked dist/, so pack it as is.
          npm pack --ignore-scripts --json > pack.json
          node -e '
            const [p] = require("./pack.json");
            const out = ["name=" + p.name, "version=" + p.version, "tarball=" + p.filename, "integrity=" + p.integrity];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(out.join("\n"));
          '

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # mint the OIDC token npm exchanges for a publish token
    env:
      TARBALL: ${{ needs.build.outputs.tarball }}
      INTEGRITY: ${{ needs.build.outputs.integrity }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No registry-url: that would write an .npmrc with a placeholder
          # token, and a failed OIDC exchange would then surface as a
          # misleading 404 instead of ENEEDAUTH.
          node-version: 24.x
          package-manager-cache: false

      - name: Verify npm supports trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("::error::npm " + process.argv[1] + " cannot use trusted publishing; 11.5.1 or later is required."); process.exit(1); }
            console.log("npm " + process.argv[1]);
          ' "$(npm --version)"

      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package

      - name: Verify the tarball is the one that was built
        run: |
          ACTUAL="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w 0)"
          if [ "$ACTUAL" != "$INTEGRITY" ]; then
            echo "::error::$TARBALL integrity $ACTUAL does not match the build job ($INTEGRITY)."
            exit 1
          fi
          echo "$TARBALL $ACTUAL"

      # A tarball publish runs no package scripts; npm exchanges the GitHub
      # OIDC token for a short-lived publish token and signs provenance.
      - name: Publish with provenance
        run: npm publish "./$TARBALL" --provenance --access public

  github-release:
    name: GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
    env:
      PKG_NAME: ${{ needs.build.outputs.name }}
      VERSION: ${{ needs.build.outputs.version }}
      INTEGRITY: ${{ needs.build.outputs.integrity }}

    steps:
      - name: Wait until the registry serves the published tarball
        run: |
          for _ in $(seq 1 40); do
            DOC="$(curl -fsS "https://registry.npmjs.org/$PKG_NAME/$VERSION" || true)"
            SERVED="$(printf '%s' "$DOC" | jq -r '.dist.integrity // empty' 2>/dev/null || true)"
            if [ -n "$SERVED" ]; then
              if [ "$SERVED" != "$INTEGRITY" ]; then
                echo "::error::The registry serves $PKG_NAME@$VERSION with integrity $SERVED, not the built $INTEGRITY."
                exit 1
              fi
              PROVENANCE="$(printf '%s' "$DOC" | jq -r '.dist.attestations.provenance.predicateType // "none"')"
              PUBLISHER="$(printf '%s' "$DOC" | jq -r '._npmUser.trustedPublisher.id // "none"')"
              {
                echo "Published \`$PKG_NAME@$VERSION\` (https://www.npmjs.com/package/$PKG_NAME/v/$VERSION)"
                echo ""
                echo "- integrity: \`$SERVED\`"
                echo "- provenance: \`$PROVENANCE\`"
                echo "- trusted publisher: \`$PUBLISHER\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$PKG_NAME@$VERSION did not appear on the registry within 10 minutes."
          exit 1

      - name: Checkout the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## v"ver"( |$)" { capture = 1; next }
            capture && /^## v[0-9]/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md) for details." > release-notes.md
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
