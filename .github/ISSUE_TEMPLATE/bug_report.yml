name: Bug report
description: Report a problem with hppx
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. The more concrete the reproduction, the faster it can be fixed.
  - type: input
    id: version
    attributes:
      label: "hppx version"
      description: "Run `npm ls hppx` or check your `package.json`."
      placeholder: "0.2.3"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: "Node.js version"
      description: "Run `node --version`."
      placeholder: "v22.11.0"
    validations:
      required: true
  - type: input
    id: express
    attributes:
      label: "Express version (if applicable)"
      description: "Run `npm ls express`."
      placeholder: "5.2.1"
  - type: dropdown
    id: module-system
    attributes:
      label: "Module system"
      options:
        - ESM (import)
        - CommonJS (require)
        - Other (note in description)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating system"
      options:
        - Linux
        - macOS
        - Windows
        - Other (note in description)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction"
      description: "Minimal code that reproduces the bug. Inline snippet or a link to a small repo. Include the hppx options you used."
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "Include the full error output / stack trace if applicable."
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: "Additional context"
      description: "Anything else relevant — middleware ordering, content-type, request shape, etc."
